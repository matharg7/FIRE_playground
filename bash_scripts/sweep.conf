# Configuration for the language sweep. Edit this, not sweep.sh.

# ---- RigL grid (27 combinations) -------------------------------------------
SPARSITIES=(0.3 0.5 0.8)
PRUNING_RATIOS=(0.3 0.7 0.9)
MASK_UPDATES=(100 1000 10000)

# ---- Dense arms ------------------------------------------------------------
# vanilla = warm-started baseline, full_reset = from-scratch control,
# fire = the paper's intervention at the chunk boundary.
DENSE_METHODS=(vanilla full_reset fire)
FIRE_ITERATION=5          # matches the paper's language script

# ---- Shared training configuration -----------------------------------------
# chunk 0 = wikitext x110            13.15B tokens (~90% of the paper's 30k ckpt)
# chunk 1 = 75% of openwebtext x1     6.78B tokens
# global batch = 8 * 60 * 1024 = 491,520 tokens/step, as in the paper
COMMON_ARGS=(
    --c0_dataset=wikitext --c0_subset_ratio=1.0 --c0_data_replay_ratio=110
    --c1_dataset=openwebtext --c1_subset_ratio=0.75 --c1_data_replay_ratio=1
    --batch_size=60 --gradient_accumulation_steps=8 --block_size=1024
    --dtype=float16
    # 200 eval batches is 200x redundant: wikitext's val set is 60,967 tokens,
    # which is 0.99 of a single 60x1024 batch. 50 costs 5s instead of 18s and
    # still covers ~69% of openwebtext's val set.
    --eval_iters=50
    --wandb_log=True
    --save_checkpoint=True --save_checkpoint_periodically=True
    # Checkpoints guard against a crash mid-run; on success they are deleted and
    # W&B is the record. Without this the sweep would leave ~580GB behind.
    --delete_checkpoints_on_success=True
)

# ---- W&B -------------------------------------------------------------------
# Set per cluster in clusters/<name>.sh, per user in local.sh, or per command
# with FIRE_WANDB_MODE=online ./sweep.sh --submit
WANDB_MODE="$FIRE_WANDB_MODE"

# ---- Scheduler -------------------------------------------------------------
# The account and the GPU/memory flags come from the cluster profile and
# bash_scripts/local.sh, so this file stays portable.
WALLTIME=18:00:00
CPUS_PER_TASK=8
MAX_CONCURRENT=0          # array throttle; 0 = let the scheduler decide

# ---- Cost estimate ---------------------------------------------------------
# tokens/sec measured on one H100 at exactly this configuration (profiling/):
# dense compiled 43.2% MFU; RigL runs eager because compiling it is 11% slower.
THROUGHPUT_DENSE=500259
THROUGHPUT_RIGL=417335    # compiled at batch 60
WIKITEXT_TOKENS=119541000
OPENWEBTEXT_TOKENS=9035582489
