# Configuration for the TRACE sweep. Edit this, not sweep.sh.
#
# Settled in T4.2 from the profiling in PLAN.md.

# ---- Model -------------------------------------------------------------------
MODEL="Qwen/Qwen2.5-0.5B"          # HuggingFaceTB/SmolLM2-135M is the fast debug model

# ---- Arms --------------------------------------------------------------------
# First comparison: dense vs RigL at low sparsity.
SPARSITIES=(0.05 0.1 0.2)
SEEDS=(0)

# Regrowth: what a regrown weight starts from, and how the drop fraction is
# scheduled. 'previous' + 'per_task' is the dst-fire-full-reset recipe
# (regrow the pretrained value; every task, including the last, keeps updating
# its topology). Add "zero" / "global" here to run those arms as well.
GROW_INITS=(previous)
DROP_FRACTION_SCHEDULES=(per_task)

# ---- Shared training configuration -------------------------------------------
# One epoch set per task over the cumulative data, TRACE's own epoch counts.
# ~3.5 h training + ~1.8 h evaluation per run on an H100 (see PLAN.md).
COMMON_ARGS=(
    --subset=5000
    --epochs_per_task=5,3,7,5,3,5,5,7   # TRACE's own per-task epochs
    --batch_size=8 --gradient_accumulation_steps=1
    --max_prompt_len=1024 --max_ans_len=512
    --learning_rate=1e-5 --weight_decay=0.0
    --length_grouped=True
    --max_eval_per_task=500 --eval_batch_size=16
    --eval_zero_shot=True --eval_loss=True --eval_lookahead=True
    --save_checkpoint=final
    --num_mask_updates=100 --t_end_ratio=0.8 --pruning_ratio=0.3
    --sparse_distribution=erk
)

# ---- Scheduler ---------------------------------------------------------------
# One job per run, one GPU per job. Raise TIME if the cluster is slower than an
# H100.
#
# scores.json is rewritten after every task boundary and W&B is online, so an
# overrun costs the tail rather than the run -- but the tail is the headline:
# 20Minuten is 30% of all optimizer steps and lands last.
#
# MEASURED, not estimated (2026-09-23): a full 8-task run takes 6.5-7.0 h, not
# the 4.6-5.6 h the bf16 profiling suggested -- fp32 generation made evaluation
# materially more expensive and the last two boundaries evaluate all 8 tasks.
# 06:50 left only 4-20 min of margin, risking the final row of the score matrix
# (the headline OP/BWT/FWT), which cannot be reconstructed.
#
# This branch runs the 3-task OVER-TRAINING subset, not the full benchmark.
#
# MEASURED on one H100 (fp32, batch 4 x accum 32). Calibrated from the 8-task
# runs as  s/step = 1.165 + 0.00284 * mean_padded_width, which reproduces the
# observed 1.485 s/step at width 112.6 and 2.555 at width 489.5:
#
#   FOMC                     390 steps, width  85.6 ->  549 s
#   FOMC+SciQA               781 steps, width 189.5 -> 1330 s
#   FOMC+SciQA+NumGLUE-cm   2343 steps, width 162.7 -> 3813 s
#   11 task-evaluations                             ->  660 s
#   TOTAL                                              1.76 h on an H100
#
# Scale for other hardware: ~1.7x on an A100 (3.0 h), ~2x on MI250 (3.5 h),
# ~3.5x on a V100 (6.2 h). 05:00 covers everything up to about 2.8x H100.
# Slurm cannot raise a running job's limit, so ask for the margin up front; if
# the target cluster has H100s, 03:00 schedules sooner and still fits.
#
# Peak memory is well under the 8-task sweep's 38 GB because MeetingBank (mean
# padded width 1142) is not in this subset -- expect roughly 20-25 GB, so a
# 40 GB card is enough.
# TRACE_TIME lets a launch override this without editing the committed default
# (nibi is all H100, where these runs are ~1.9-2.1 h; a slower cluster needs the
# full 05:00). Slurm cannot raise a running job's limit, so the default stays
# generous and a fast site opts down.
TIME="${TRACE_TIME:-05:00:00}"
CPUS_PER_TASK=6
MEM_PER_CPU="8G"
# [type:]count. A bare count is portable, but a site whose GPUs are partitioned
# needs the type named or the run can land on a MIG slice too small for it
# (nibi: 10GB and 40GB slices against a 47GB peak). Set TRACE_GPUS_PER_TASK in
# scripts/local.sh there; env.sh is sourced before this file.
GPUS_PER_TASK="${TRACE_GPUS_PER_TASK:-1}"
