# REPLAY-RATIO comparison on the 3-task subset, TRACE epochs 3,3,5.
#
# How much of the history do you have to keep for sparsity to matter? Every run
# so far used full cumulative replay (ratio 1.0), where each task trains on the
# complete union of tasks 0..t -- the strongest possible anti-forgetting
# baseline, and our addition rather than TRACE's (their base method replays
# nothing). Under full replay every BWT we measured was POSITIVE, i.e. nothing
# was forgetting, which leaves sparsity little to fix.
#
# Ratio r keeps a seeded random r-fraction of each EARLIER task; the current
# task is always complete. Cumulative set sizes and cost:
#
#   r     task0   task1   task2   steps  delta_t   ~h
#   0.2   5,000   6,000   7,000     533      4    0.42
#   0.5   5,000   7,500  10,000     685      5    0.49
#   0.8   5,000   9,000  13,000     837      6    0.56
#   1.0   5,000  10,000  15,000     939      7    0.61   <- already done
#
# Ratio 1.0 references (seed 0): dense 0.6308, rigl s0.3 [gate] 0.6390.
# Over three seeds at ratio 1.0: dense 0.6194 +/- 0.0222, gate 0.6304 +/- 0.0095,
# so single-seed differences under ~0.02 here are inside the noise. The useful
# signal would be a TREND across ratios, not any one cell.
#

program: src/train.py
project: dst_trace_overtrain
method: grid

metric:
  name: cl/op
  goal: maximize

parameters:
  seed:
    values: [0]
  replay_ratio:
    values: [0.2, 0.5, 0.8]

  sparsifier:              {value: dense}

  model:                   {value: Qwen/Qwen2.5-0.5B}
  subset:                  {value: 5000}
  tasks:                   {value: "FOMC,ScienceQA,NumGLUE-cm"}
  # TRACE's own epochs for these three tasks.
  epochs_per_task:         {value: "3,3,5"}
  batch_size:              {value: 4}
  gradient_accumulation_steps: {value: 32}
  dtype:                   {value: float32}
  max_prompt_len:          {value: 1024}
  max_ans_len:             {value: 512}
  learning_rate:           {value: 0.00001}
  lr_schedule:             {value: constant}
  warmup_ratio:            {value: 0.0}
  weight_decay:            {value: 0.0}
  length_grouped:          {value: "True"}
  reset_optimizer:         {value: "True"}

  max_eval_per_task:       {value: 500}
  eval_batch_size:         {value: 16}
  eval_zero_shot:          {value: "True"}
  eval_loss:               {value: "True"}
  eval_lookahead:          {value: "True"}

  save_checkpoint:         {value: final}
  wandb_mode:              {value: online}
  wandb_project:           {value: dst_trace_overtrain}

command:
  - ${env}
  - python
  - -u
  - ${program}
  - ${args}
