# W&B sweep: Qwen2.5-1.5B, RigL s0.1 on gate_proj only, 3-task subset.
#
#   ./scripts/launch_wandb_sweep.sh scripts/sweep_1p5b_gate_s01.yaml --submit
#
# Lowers the dose at the scale where s0.3 gate LOST to dense (job 22698043):
#
#   dense            FOMC 0.710  ScienceQA 0.914  NumGLUE-cm 0.531  OP 0.7182
#   rigl s0.3 gate   FOMC 0.710  ScienceQA 0.904  NumGLUE-cm 0.457  OP 0.6902
#
# The entire -0.0280 sits in NumGLUE-cm, the LAST task; the two retained tasks
# are within a point of dense and BWT is positive (+0.0120). So the deficit is
# weaker acquisition of the final task, not forgetting -- which is what a dose
# reduction should address if the mask is simply removing capacity the last
# task needs. s0.1 leaves 90% of gate_proj trainable (2.5% effective global
# sparsity against 7.5% at s0.3).
#
# This also mirrors the 0.5B picture in reverse: there gate s0.3 BEAT dense
# (0.6483 vs 0.6308), so 1.5B inverted the sign. A third dose point says
# whether that is a dose effect at this scale or noise -- and the noise floor
# here is large (seed replication at 0.5B: dense 0.6194 +/- 0.0222).
#
# Identical to sweep_1p5b_gate.yaml except sparsity. Masking does not change
# the dense matmul cost, so runtime should match that run's measured 1:21:06.

program: src/train.py
project: dst_trace_overtrain
method: grid

metric:
  name: cl/op
  goal: maximize

parameters:
  seed:
    values: [0]

  sparsifier:              {value: rigl}
  sparsity:                {value: 0.1}
  sparse_targets:          {value: gate}
  sparse_distribution:     {value: erk}
  grow_init:               {value: previous}
  drop_fraction_schedule:  {value: per_task}
  # Only 939 steps here, so num_mask_updates must come DOWN, not up: 600 would
  # give delta_t=1, a topology update every single step. 100 gives delta_t=7
  # (13/26/66 updates per task), the closest match to the 8-task runs' delta_t=9
  # while keeping a safe margin in the shortest task. check_update_cadence()
  # enforces this at startup.
  num_mask_updates:        {value: 100}
  t_end_ratio:             {value: 0.8}
  pruning_ratio:           {value: 0.3}

  model:                   {value: Qwen/Qwen2.5-1.5B}
  subset:                  {value: 5000}
  tasks:                   {value: "FOMC,ScienceQA,NumGLUE-cm"}
  # TRACE's own epochs for these three tasks.
  epochs_per_task:         {value: "3,3,5"}
  batch_size:              {value: 2}
  gradient_accumulation_steps: {value: 64}
  dtype:                   {value: float32}
  max_prompt_len:          {value: 1024}
  max_ans_len:             {value: 512}
  learning_rate:           {value: 0.00001}
  lr_schedule:             {value: constant}
  warmup_ratio:            {value: 0.0}
  weight_decay:            {value: 0.0}
  length_grouped:          {value: "True"}
  reset_optimizer:         {value: "True"}

  max_eval_per_task:       {value: 500}
  eval_batch_size:         {value: 8}
  eval_zero_shot:          {value: "True"}
  eval_loss:               {value: "True"}
  eval_lookahead:          {value: "True"}

  save_checkpoint:         {value: final}
  wandb_mode:              {value: online}
  wandb_project:           {value: dst_trace_overtrain}

command:
  - ${env}
  - python
  - -u
  - ${program}
  - ${args}
