program: ../bash_scripts/run_vision_st.sh
project: DST Continual Learning
entity: ucalgary
name: DST TinyImageNet-VGG16 Class Incremental targeted sweep (SET + RigL, s=0.3/0.9)
method: grid

# grid ignores the metric for scheduling; it's only used for dashboard plots.
metric:
  goal: maximize
  name: test/acc

parameters:
  # Fixed.
  task:
    value: TinyImageNet
  model:
    value: VGG16
  # 20 cumulative class chunks (5 new classes each for CIFAR100, 10 for
  # TinyImageNet); train_st.py also logs test/acc_full over every class.
  benchmark:
    value: class_incremental
  # Pinned so train_st.py's explicit wandb.init(project=...) matches this
  # sweep's project instead of falling back to class_incremental_TinyImageNet_VGG16.
  wandb_project:
    value: "DST Continual Learning"
  # Recurring cosine LR decay: cosine_T_max_epochs stays at its default 0, so
  # T_max = real_epochs and train_st.py rebuilds the scheduler every chunk.
  use_cosine_lr:
    value: "True"
  # Evaluation cadence.  A full test pass is the dominant non-training cost, so
  # run it every 5 logged epochs; train_st.py always evaluates a chunk's last
  # epoch, so task boundaries are still measured.  Evaluation is forward-only
  # and can use a far larger batch than training.  Both values are
  # vision/config_st.py's defaults, which run_vision_st.sh otherwise overrides
  # with 1 / 64.
  eval_every:
    value: 5
  eval_batch_size:
    value: 1024
  # Drop fraction: one global cosine decay over t_end = 0.8 * total_steps.
  # Held fixed so this sweep differs from its sample-incremental counterpart
  # only in the benchmark; 'per_task' is a separate question.
  drop_fraction_schedule:
    value: global

  # Swept axes.  Targeted subset of tin_vgg16_class_inc_set_rigl.yaml: only
  # sparsities 0.3 / 0.9 at num_mask_updates=100; everything else is identical.
  sparsifier:
    values: [set, rigl]
  sparsity:
    values: [0.3, 0.9]
  pruning_ratio:
    values: [0.3]
  num_mask_updates:
    values: [100]
  seed:
    values: [0, 1, 2]

# 2 * 2 * 1 * 1 * 3 = 12 runs.
#
# ${args} expands to --task=TinyImageNet --model=VGG16 ... --sparsifier=<m> ...,
# all of which run_vision_st.sh accepts in its underscore spelling. --log-subdir
# is appended as a constant so every trial logs to
# logs/tin_vgg16_class_inc_set_rigl_targeted/<run_name>.out.
command:
  - bash
  - ${program}
  - ${args}
  - "--log-subdir"
  - "tin_vgg16_class_inc_set_rigl_targeted"
