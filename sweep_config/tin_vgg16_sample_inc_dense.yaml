program: ../bash_scripts/run_vision_st.sh
project: DST Continual Learning
entity: ucalgary
name: DST TinyImageNet-VGG16 Sample Incremental sweep (Dense baseline)
method: grid

# grid ignores the metric for scheduling; it's only used for dashboard plots.
metric:
  goal: maximize
  name: test/acc

parameters:
  # Fixed.
  task:
    value: TinyImageNet
  model:
    value: VGG16
  benchmark:
    value: continual
  # Pinned so train_st.py's explicit wandb.init(project=...) matches this
  # sweep's project instead of falling back to continual_TinyImageNet_VGG16.
  wandb_project:
    value: "DST Continual Learning"
  # Recurring cosine LR decay: cosine_T_max_epochs stays at its default 0, so
  # T_max = real_epochs and train_st.py rebuilds the scheduler every chunk.
  use_cosine_lr:
    value: "True"
  # No sparsifier: build_sparsifier() returns None, so sparsity,
  # pruning_ratio and num_mask_updates are all irrelevant here.
  sparsifier:
    value: dense

  # Swept axis.
  seed:
    values: [0, 1, 2]

# 3 runs.
command:
  - bash
  - ${program}
  - ${args}
  - "--log-subdir"
  - "tin_vgg16_sample_inc_dense"
